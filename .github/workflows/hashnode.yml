name: "📚 Latest Blog"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC (07:47 AM IST)

permissions:
  contents: write

jobs:
  update_blogs:
    name: "Update With Latest Blogs"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Fetching Repository Contents"
        uses: actions/checkout@v4

      - name: "🌐 Fetch Hashnode Posts via GraphQL & Update README"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const query = `
              query {
                publication(host: "blog.surajdev.tech") {
                  posts(first: 4) {
                    edges {
                      node {
                        title
                        url
                        publishedAt
                        brief
                        coverImage {
                          url
                        }
                      }
                    }
                  }
                }
              }
            `;

            // Query Hashnode GraphQL with a standard browser User-Agent to bypass Cloudflare block
            const response = await fetch('https://gql.hashnode.com', {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              },
              body: JSON.stringify({ query })
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Hashnode API HTTP ${response.status}: ${errText.slice(0, 200)}`);
            }

            const result = await response.json();
            
            if (!result.data || !result.data.publication || !result.data.publication.posts) {
              throw new Error(`Invalid GraphQL structure returned: ${JSON.stringify(result)}`);
            }

            const posts = result.data.publication.posts.edges.map(e => e.node);

            // Build HTML table snippet
            let tableHtml = '';
            for (const post of posts) {
              const date = new Date(post.publishedAt).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
              });
              
              const brief = post.brief.length > 110 ? post.brief.slice(0, 110).trim() + '…' : post.brief;
              const cover = post.coverImage?.url || 'https://cdn.hashnode.com/res/hashnode/image/upload/v1611242138218/426a86e7-0130-4e2a-89b4-b4a1b021d7c4.png';

              tableHtml += `<table><tr><td width="160"><a href="${post.url}"><img src="${cover}" width="160" alt="${post.title}"/></a></td><td valign="top"><a href="${post.url}"><b>${post.title}</b></a><br/>${brief}<br/><sub>${date}</sub></td></tr></table>`;
            }

            // Inject into README between comment tags
            let readme = fs.readFileSync('README.md', 'utf8');
            const startTag = '<!-- BLOG-POST-LIST:START -->';
            const endTag = '<!-- BLOG-POST-LIST:END -->';
            
            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);
            if (!regex.test(readme)) {
              throw new Error(`Could not find ${startTag} and ${endTag} in README.md`);
            }

            const updatedReadme = readme.replace(regex, `${startTag}\n${tableHtml}\n${endTag}`);
            fs.writeFileSync('README.md', updatedReadme);

      - name: "🚀 Commit & Push Changes"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes detected in README.md"
          else
            git commit -m "chore: update latest blog posts from Hashnode API"
            git push
          fi
