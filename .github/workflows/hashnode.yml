name: "📚 Latest Blog"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC (07:47 AM IST)

permissions:
  contents: write

jobs:
  update_blogs:
    name: "Update With Latest Blogs"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Fetching Repository Contents"
        uses: actions/checkout@v4

      - name: "📚 Pull Latest Hashnode Posts"
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.surajdev.tech/rss.xml"
          max_post_count: 4
          date_format: "mmm d, yyyy"
          template: '$newline<table><tr><td width="160"><a href="$url"><img src="$coverImage" width="160" alt="$title"/></a></td><td valign="top"><a href="$url"><b>$title</b></a><br/>$description<br/><sub>$date</sub></td></tr></table>'
          item_exec: |
            let cover = '';
            
            // 1. Priority: Standard Hashnode RSS enclosure tag
            if (item.enclosure && item.enclosure.url && item.enclosure.url.startsWith('http')) {
              cover = item.enclosure.url;
            }
            
            // 2. Priority: Extract first <img> tag from content body
            if (!cover) {
              const html = item['content:encoded'] || item.content || item.description || '';
              const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
              if (match && match[1] && match[1].startsWith('http')) {
                cover = match[1];
              }
            }
            
            // 3. Fallback: Default Hashnode banner (prevents broken image box if post has no cover)
            if (!cover) {
              cover = 'https://cdn.hashnode.com/res/hashnode/image/upload/v1611242138218/426a86e7-0130-4e2a-89b4-b4a1b021d7c4.png';
            }
            
            post.coverImage = cover;

            // Clean description text and trim length
            let raw = item.contentSnippet || item['content:encoded'] || item.content || item.description || '';
            let text = raw.replace(/<[^>]*>/g, ' ').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();
            if (text.length > 110) { text = text.slice(0, 110).trim() + '…'; }
            post.description = text;
